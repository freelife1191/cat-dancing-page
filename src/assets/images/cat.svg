<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 고양이 몸체 -->
  <ellipse cx="100" cy="140" rx="40" ry="30" fill="#FFB366" stroke="#E69645" stroke-width="2"/>

  <!-- 고양이 머리 -->
  <circle cx="100" cy="80" r="35" fill="#FFB366" stroke="#E69645" stroke-width="2"/>

  <!-- 고양이 귀 -->
  <polygon points="75,55 85,35 95,55" fill="#FFB366" stroke="#E69645" stroke-width="2"/>
  <polygon points="105,55 115,35 125,55" fill="#FFB366" stroke="#E69645" stroke-width="2"/>

  <!-- 귀 안쪽 -->
  <polygon points="78,52 85,40 92,52" fill="#FF9F66"/>
  <polygon points="108,52 115,40 122,52" fill="#FF9F66"/>

  <!-- 고양이 눈 -->
  <ellipse cx="90" cy="75" rx="6" ry="8" fill="#2C3E50"/>
  <ellipse cx="110" cy="75" rx="6" ry="8" fill="#2C3E50"/>

  <!-- 눈 하이라이트 -->
  <ellipse cx="92" cy="72" rx="2" ry="3" fill="#FFFFFF"/>
  <ellipse cx="112" cy="72" rx="2" ry="3" fill="#FFFFFF"/>

  <!-- 고양이 코 -->
  <polygon points="100,85 95,90 105,90" fill="#FF6B9D"/>

  <!-- 고양이 입 -->
  <path d="M 100,92 Q 95,96 90,92" stroke="#2C3E50" stroke-width="2" fill="none"/>
  <path d="M 100,92 Q 105,96 110,92" stroke="#2C3E50" stroke-width="2" fill="none"/>

  <!-- 고양이 수염 -->
  <line x1="70" y1="80" x2="85" y2="82" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="70" y1="85" x2="85" y2="85" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="70" y1="90" x2="85" y2="88" stroke="#2C3E50" stroke-width="1.5"/>

  <line x1="115" y1="82" x2="130" y2="80" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="115" y1="85" x2="130" y2="85" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="115" y1="88" x2="130" y2="90" stroke="#2C3E50" stroke-width="1.5"/>

  <!-- 고양이 다리 -->
  <ellipse cx="80" cy="165" rx="8" ry="15" fill="#FFB366" stroke="#E69645" stroke-width="2"/>
  <ellipse cx="95" cy="165" rx="8" ry="15" fill="#FFB366" stroke="#E69645" stroke-width="2"/>
  <ellipse cx="105" cy="165" rx="8" ry="15" fill="#FFB366" stroke="#E69645" stroke-width="2"/>
  <ellipse cx="120" cy="165" rx="8" ry="15" fill="#FFB366" stroke="#E69645" stroke-width="2"/>

  <!-- 고양이 발가락 -->
  <circle cx="80" cy="175" r="4" fill="#E69645"/>
  <circle cx="95" cy="175" r="4" fill="#E69645"/>
  <circle cx="105" cy="175" r="4" fill="#E69645"/>
  <circle cx="120" cy="175" r="4" fill="#E69645"/>

  <!-- 고양이 꼬리 -->
  <path d="M 140,130 Q 160,120 165,100 Q 170,80 160,60" stroke="#FFB366" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- 고양이 배 무늬 -->
  <ellipse cx="100" cy="140" rx="20" ry="15" fill="#FFC999"/>

  <!-- 고양이 볼 -->
  <circle cx="75" cy="85" r="5" fill="#FF9F66" opacity="0.6"/>
  <circle cx="125" cy="85" r="5" fill="#FF9F66" opacity="0.6"/>
</svg>